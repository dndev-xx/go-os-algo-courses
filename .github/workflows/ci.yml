name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  GO_VERSION: 1.25
  GOLANGCI_LINT_VERSION: "v2.8.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/checkout@v4

      - name: Install golangci-lint
        run: |
          echo "Installing golangci-lint ${GOLANGCI_LINT_VERSION}"
          curl -sSfL https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo mv "/tmp/golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-amd64/golangci-lint" /usr/local/bin/
          golangci-lint --version

      - name: Run golangci-lint
        run: |
          golangci-lint run --timeout=5m ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/checkout@v4
      - run: go test -race ./...

  bench-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc
          go mod download

      - name: Make script executable
        run: chmod +x ./run_benchmarks.sh

      - name: Run benchmarks
        run: ./run_benchmarks.sh
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_results/
            *.log

  build:
    strategy:
      matrix:
        go-version: [^1.25.4]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - uses: actions/checkout@v4
      - run: go build -o ./bin/main ./cmd/main.go
